name: Security Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm run lint
      - run: pnpm test
