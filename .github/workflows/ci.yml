name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check environment contract
        run: pnpm run check:env

      - name: Lint (tsc --noEmit)
        run: pnpm run lint

      - name: Test (vitest)
        run: pnpm test

      - name: Build
        run: pnpm run build

  # Gate de higiene: nunca commitear state ni secretos.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no state/secret files tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.[^a]|.*\.db(-shm|-wal)?$|data/.*\.db)' | grep -v '.env.example'; then
            echo "::error::Archivos de estado o secretos están trackeados en git."
            git ls-files | grep -E '(^|/)(\.env|\.env\.[^a]|.*\.db(-shm|-wal)?$|data/.*\.db)' | grep -v '.env.example' || true
            exit 1
          fi
          echo "OK: no hay state/secretos trackeados."
