  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@next/*'
  - next
  - tsx
  - zod
  - '@types/zod'
overrides:
  undici: ^7.14.0
  ajv: ^8.18.0
  uuid: ^11.1.1
  path-to-regexp: ^6.3.0
  fast-uri: ^3.1.5
  ip-address: ^10.3.1
  nanoid: ^3.3.18
  deepmerge-ts: ^8.0.0
  hono: '>=4.12.34'
  '@hono/node-server': ^1.19.15
  body-parser: ^2.3.0
